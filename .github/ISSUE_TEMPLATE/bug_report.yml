name: Bug report
description: Report a reproducible PHITS AI Editor problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, private research data, or PHITS files that you cannot redistribute.
  - type: input
    id: editor_version
    attributes:
      label: PHITS AI Editor version
      placeholder: 0.0.1-alpha or commit hash
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal sanitized workspace when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal information, private research data, and non-redistributable PHITS material.
          required: true
